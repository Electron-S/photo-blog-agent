name: ci

on: [push, pull_request]

permissions:
  contents: read

env:
  # playwright 패키지는 postinstall에서 브라우저 바이너리(~150MB)를 받는다.
  # 유닛 테스트는 네이버 모듈을 건드리지 않으므로 다운로드만 막는다.
  #
  # `npm ci --omit=optional`을 쓰면 안 된다 — sharp도 플랫폼별 네이티브 바이너리를
  # optionalDependencies(@img/sharp-*)로 받기 때문에 sharp까지 통째로 깨진다.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest가 핵심이다. 초안 HTML의 \r\n 개행, 파일 쓰기 인코딩,
        # 경로 조합처럼 WSL 로컬에서는 절대 드러나지 않는 문제를 여기서 잡는다.
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci 자체가 lockfile 동기화 게이트다 — drift가 있으면 여기서 실패한다.
      - run: npm ci
      - run: npm test
      # 시계 종속 회귀 방어. lib/slug.js가 "미래 날짜는 카메라 시계 오류"로
      # 판정하므로, 날짜를 하드코딩한 테스트가 new Date() 기본값에 의존하면
      # 시계가 그 날짜보다 이전인 환경에서 조용히 깨진다. 시계를 ±2년 옮겨
      # 돌려 그런 종속이 새로 생기는 것을 막는다 (실측으로 2건이 깨진 적 있다).
      - name: clock -2y
        run: npm run test:clock
        env:
          CLOCK_OFFSET_MS: '-63072000000'
      - name: clock +2y
        run: npm run test:clock
        env:
          CLOCK_OFFSET_MS: '63072000000'
